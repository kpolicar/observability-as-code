global:
  scrape_interval: 1s
  evaluation_interval: 5s

scrape_configs:
- job_name: node
  static_configs:
    - targets:
        - 'node_exporter:9100'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - 'rules/1.basic.yml'
